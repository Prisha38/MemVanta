name: Add Hugging Face Dataset badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hf-dataset-badge-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Dataset badge
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('README.md')
          text = path.read_text(encoding='utf-8')
          badge = '[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)](https://huggingface.co/datasets/sauravsingla08/MemVanta-CPU-LLM-Memory-Benchmark)'
          if badge not in text:
              text = text.replace('# MemVanta\n\n', '# MemVanta\n\n' + badge + '\n\n', 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit badge and remove one-time workflow
        run: |
          rm .github/workflows/add-hf-dataset-badge-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md .github/workflows/add-hf-dataset-badge-once.yml
          git commit -m "docs: link MemVanta Hugging Face dataset"
          git push

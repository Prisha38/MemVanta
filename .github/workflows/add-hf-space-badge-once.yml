name: Add Hugging Face Space badge once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-hf-space-badge-once.yml'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Space badge
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          dataset = '[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)](https://huggingface.co/datasets/sauravsingla08/MemVanta-CPU-LLM-Memory-Benchmark)'
          space = '[![Hugging Face Space](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Live%20Space-FFD21E)](https://huggingface.co/spaces/sauravsingla08/MemVanta)'
          if space not in s:
              s = s.replace(dataset, dataset + '\n' + space, 1)
          p.write_text(s)
          PY

      - name: Commit badge and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/add-hf-space-badge-once.yml
          git add README.md
          git commit -m 'docs: add Hugging Face Space badge'
          git push

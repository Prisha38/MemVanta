name: Finalize Hugging Face Space once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-hf-space-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Add Space badge and clean deployment trigger files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('README.md')
          s = p.read_text()
          dataset = '[![Hugging Face Dataset](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Dataset-FFD21E)](https://huggingface.co/datasets/sauravsingla08/MemVanta-CPU-LLM-Memory-Benchmark)'
          space = '[![Hugging Face Space](https://img.shields.io/badge/%F0%9F%A4%97%20Hugging%20Face-Live%20Space-FFD21E)](https://huggingface.co/spaces/sauravsingla08/MemVanta)'
          if space not in s:
              s = s.replace(dataset, dataset + '\n' + space, 1)
          p.write_text(s)
          PY
          find hf-space -maxdepth 1 -type f -name '.*' -delete

      - name: Commit final integration and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-hf-space-once.yml
          git add -A README.md hf-space
          if git diff --cached --quiet; then
            echo 'No changes to commit'
            exit 0
          fi
          git commit -m 'docs: finalize Hugging Face Space integration'
          git push
